name: quality-gate

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  web-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: bash scripts/quality_gate.sh
